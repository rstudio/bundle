# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: main
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - uses: astral-sh/setup-uv@v6

      - name: Create Python environment for legacy keras
        # Legacy keras needs numpy<2, and TensorFlow wheels for Python 3.13+
        # need numpy>=2, so pin Python 3.12 instead of reticulate's default
        shell: bash
        run: |
          venv="$RUNNER_TEMP/r-keras"
          uv venv --python 3.12 "$venv"
          if [ "$RUNNER_OS" = "Windows" ]; then
            python="$venv/Scripts/python.exe"
          else
            python="$venv/bin/python"
          fi
          uv pip install --python "$python" tensorflow tf-keras "numpy<2"
          echo "RETICULATE_PYTHON=$python" >> "$GITHUB_ENV"

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
