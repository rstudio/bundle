# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: main
  pull_request:

name: test-coverage

permissions: read-all

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage

      - uses: astral-sh/setup-uv@v6

      - name: Create Python environment for legacy keras
        # Legacy keras needs numpy<2, and TensorFlow wheels for Python 3.13+
        # need numpy>=2, so pin Python 3.12 instead of reticulate's default
        shell: bash
        run: |
          venv="$RUNNER_TEMP/r-keras"
          uv venv --python 3.12 "$venv"
          if [ "$RUNNER_OS" = "Windows" ]; then
            python="$venv/Scripts/python.exe"
          else
            python="$venv/bin/python"
          fi
          uv pip install --python "$python" tensorflow tf-keras "numpy<2"
          echo "RETICULATE_PYTHON=$python" >> "$GITHUB_ENV"

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          print(cov)
          covr::to_cobertura(cov)
        shell: Rscript {0}

      - name: Show testthat output
        if: always()
        run: |
          ## --------------------------------------------------------------------
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package
